<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Convert PNG, JPEG, WebP and other images to compact SVG in your browser. Transparency is preserved and nothing is uploaded." />
    <meta name="color-scheme" content="light dark" />
    <title>Image to SVG Converter</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b50d8'/%3E%3Cpath fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' d='M7 23C13 23 11 9 16 9s3 14 9 14'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="masthead">
      <h1>Image to SVG Converter</h1>
      <p>Images to clean vector files. Everything runs in your browser, so nothing is uploaded.</p>
    </header>

    <main>
      <label class="drop" id="drop">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif" multiple />
        <strong>Drop images here, or choose files</strong>
        <span>PNG, JPEG, WebP, GIF, BMP or AVIF. You can also paste from the clipboard.</span>
      </label>

      <form class="settings" id="settings" hidden>
        <fieldset class="presets">
          <legend>Image type</legend>
          <label><input type="radio" name="preset" value="logo" /><span>Logo</span></label>
          <label><input type="radio" name="preset" value="illustration" checked /><span>Illustration</span></label>
          <label><input type="radio" name="preset" value="photo" /><span>Photo</span></label>
          <label><input type="radio" name="preset" value="pixel" /><span>Pixel art</span></label>
        </fieldset>
        <label class="slider">Colors <output id="colors-out"></output>
          <input type="range" id="colors" name="colors" min="1" max="8" />
        </label>
        <label class="slider">Remove specks <output id="speckle-out"></output>
          <input type="range" id="speckle" name="speckle" min="0" max="32" />
        </label>
        <label class="slider">Corner sharpness <output id="corners-out"></output>
          <input type="range" id="corners" name="corners" min="0" max="180" />
        </label>
        <label class="toggle"><input type="checkbox" id="remove-background" name="removeBackground" /> Remove background</label>
        <label class="toggle"><input type="checkbox" id="remove-enclosed" name="removeEnclosed" checked disabled /> Also inside shapes</label>
        <label class="slider">Background tolerance <output id="backgroundTolerance-out"></output>
          <input type="range" id="backgroundTolerance" name="backgroundTolerance" min="1" max="128" disabled />
        </label>
        <button type="button" class="primary" id="download-all" hidden>Download all (.zip)</button>
      </form>

      <p class="status" id="status" role="status" aria-live="polite"></p>
      <ul class="results" id="results"></ul>
    </main>

    <template id="result-template">
      <li class="result">
        <div class="result-head">
          <h2 class="name"></h2>
          <button type="button" class="ghost remove">Remove</button>
        </div>
        <div class="compare">
          <figure><figcaption>Original</figcaption><div class="stage"><img class="original" alt="" /></div></figure>
          <figure><figcaption>SVG</figcaption><div class="stage"><img class="vector" alt="" hidden /><span class="busy">Tracing…</span></div></figure>
        </div>
        <div class="result-foot">
          <p class="stats"></p>
          <div class="actions">
            <button type="button" class="ghost copy" disabled>Copy SVG</button>
            <a class="button primary download" aria-disabled="true">Download</a>
          </div>
        </div>
      </li>
    </template>
  </body>
</html>
